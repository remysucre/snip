<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snip</title>
<style>
  :root {
    --bg: #f6f7f6;
    --surface: #ffffff;
    --code-bg: #f0f2f0;
    --ink: #212a26;
    --muted: #5f6b65;
    --line: #d9dfdb;
    --accent: #0e7d5b;
    --accent-hover: #0a6a4e;
    --accent-ink: #ffffff;
    --err: #a93e36;
    --err-bg: #fbf1f0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121715;
      --surface: #1a201d;
      --code-bg: #161c19;
      --ink: #e2e8e4;
      --muted: #8c9a93;
      --line: #2c3531;
      --accent: #37b389;
      --accent-hover: #45c497;
      --accent-ink: #0c120f;
      --err: #e38077;
      --err-bg: #2a1d1b;
    }
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    margin: 0;
    padding: 3rem 1.25rem;
  }

  form.snippet {
    max-width: 40rem;
    margin: 0 auto;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    overflow: hidden;
  }
  .snippet textarea {
    display: block;
    width: 100%;
    box-sizing: border-box;
    border: none;
    resize: vertical;
    background: var(--code-bg);
    color: var(--ink);
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.85rem;
    line-height: 1.55;
    padding: 0.85rem 1rem;
    white-space: pre;
    overflow-x: auto;
  }
  .snippet textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .snippet-bar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.55rem 0.85rem;
    border-top: 1px solid var(--line);
  }
  .snippet button {
    font: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 5px;
    padding: 0.35rem 1rem;
    cursor: pointer;
  }
  .snippet button:hover:not(:disabled) { background: var(--accent-hover); }
  .snippet button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .snippet button:disabled { opacity: 0.6; cursor: default; }
  .status {
    font-size: 0.75rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .status.failed { color: var(--err); }
  .snippet pre {
    margin: 0;
    padding: 0.85rem 1rem;
    border-top: 1px solid var(--line);
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.85rem;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .snippet pre.error {
    background: var(--err-bg);
    color: var(--err);
  }
</style>
</head>
<body>

<form id="snippet" class="snippet">
  <textarea name="code" rows="9" spellcheck="false">
def fib(n):
    a, b = 0, 1
    for _ in range(n):
        a, b = b, a + b
    return a

for i in range(8):
    print(i, fib(i))</textarea>
  <div class="snippet-bar">
    <button>Run</button>
    <span class="status"></span>
  </div>
  <pre hidden></pre>
</form>

<script type="module">
  const form = document.getElementById('snippet');
  const button = form.querySelector('button');
  const output = form.querySelector('pre');
  const status = form.querySelector('.status');

  let loadMicroPython = null;

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    button.disabled = true;
    button.textContent = 'Running…';
    status.textContent = loadMicroPython ? 'running' : 'loading runtime…';
    status.classList.remove('failed');

    const lines = [];
    const capture = (text) => lines.push(text);
    let failed = false;
    const t0 = performance.now();
    try {
      if (!loadMicroPython) {
        ({ loadMicroPython } = await import('./vendor/micropython.mjs'));
      }
      // fresh interpreter per run, so every run is a clean slate
      const mp = await loadMicroPython({ stdout: capture, stderr: capture });
      await mp.runPythonAsync(form.code.value);
    } catch (err) {
      lines.push(String(err.message ?? err).trim());
      failed = true;
    }
    const ms = Math.max(1, Math.round(performance.now() - t0));

    output.textContent = lines.join('\n') || '(no output)';
    output.classList.toggle('error', failed);
    output.hidden = false;
    status.textContent = (failed ? '✗ failed' : '✓ ok') + ' · ' + ms + ' ms';
    status.classList.toggle('failed', failed);
    button.disabled = false;
    button.textContent = 'Run';
  });
</script>
</body>
</html>
